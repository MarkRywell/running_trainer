org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# This project lives on I: while the Pub cache is on C:. Kotlin's incremental
# compiler requires a source file and its base file to share a root, so any
# plugin with Kotlin sources (shared_preferences_android) fails with
# "this and base files have different roots" and then
# "Could not close incremental caches". Disabling incremental compilation
# avoids the cross-drive case entirely at a small cost in build time.
#
# If the project is ever moved onto C:, or PUB_CACHE is moved onto I:, this can
# be removed.
kotlin.incremental=false
